name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/stele
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy (headless)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/stele
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/stele
      - run: cargo clippy -p stele-server --features headless --no-default-features -- -D warnings
      - run: cargo clippy -p stele-cli -- -D warnings

  check-desktop:
    name: Check (desktop, macOS)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/stele
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/stele
      - run: cargo check -p stele-server
      - run: cargo check -p stele-cli

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/stele
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/stele
      - name: Build binaries
        run: cargo build -p stele-server --features headless --no-default-features -p stele-cli
      - name: Run e2e tests
        run: python3 ../../tests/e2e_test.py --no-build

  validate-plugin:
    name: Validate plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required files
        run: |
          for f in \
            plugins/stele/.claude-plugin/plugin.json \
            plugins/stele/skills/install/SKILL.md \
            plugins/stele/skills/bootstrap/SKILL.md \
            plugins/stele/skills/sync/SKILL.md \
            plugins/stele/skills/checkpoint/SKILL.md \
            plugins/stele/skills/bootstrap/references/claude-md-template.md \
            plugins/stele/agents/stele-librarian.md \
            plugins/stele/README.md; do
            [ -f "$f" ] || { echo "Missing: $f"; exit 1; }
          done
          echo "All plugin files present."

      - name: Validate JSON files
        run: |
          python3 -c "import json; json.load(open('plugins/stele/.claude-plugin/plugin.json'))"
          python3 -c "import json; json.load(open('.claude-plugin/marketplace.json'))"

      - name: Check version sync
        run: |
          CARGO_VER=$(grep '^version' apps/stele/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          PLUGIN_VER=$(python3 -c "import json; print(json.load(open('plugins/stele/.claude-plugin/plugin.json'))['version'])")
          MARKET_VER=$(python3 -c "import json; print([p['version'] for p in json.load(open('.claude-plugin/marketplace.json'))['plugins'] if p['name']=='stele'][0])")
          OK=true
          if [ "$CARGO_VER" != "$PLUGIN_VER" ]; then
            echo "Version mismatch: Cargo.toml=$CARGO_VER plugin.json=$PLUGIN_VER"
            OK=false
          fi
          if [ "$CARGO_VER" != "$MARKET_VER" ]; then
            echo "Version mismatch: Cargo.toml=$CARGO_VER marketplace.json=$MARKET_VER"
            OK=false
          fi
          $OK && echo "All versions match: $CARGO_VER" || exit 1

  validate-steop-plugin:
    name: Validate steop plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required files
        run: |
          for f in \
            plugins/steop/.claude-plugin/plugin.json \
            plugins/steop/skills/st-flow/SKILL.md \
            plugins/steop/skills/st-clarify/SKILL.md \
            plugins/steop/skills/st-research/SKILL.md \
            plugins/steop/skills/st-plan/SKILL.md \
            plugins/steop/skills/st-execute/SKILL.md \
            plugins/steop/skills/st-validate/SKILL.md \
            plugins/steop/agents/consultant.md \
            plugins/steop/agents/researcher.md \
            plugins/steop/agents/architect.md \
            plugins/steop/agents/executor.md \
            plugins/steop/agents/reviewer.md \
            plugins/steop/hooks/hooks.json \
            plugins/steop/docs/DESIGN.md \
            plugins/steop/README.md \
            apps/steop/go.mod \
            apps/steop/main.go \
            apps/steop/version.go; do
            [ -f "$f" ] || { echo "Missing: $f"; exit 1; }
          done
          echo "All steop plugin files present."

      - name: Validate JSON
        run: |
          python3 -c "import json; json.load(open('plugins/steop/.claude-plugin/plugin.json'))"
          python3 -c "import json; json.load(open('plugins/steop/hooks/hooks.json'))"

      - name: Check version sync
        run: |
          STEOP_PLUGIN_VER=$(python3 -c "import json; print(json.load(open('plugins/steop/.claude-plugin/plugin.json'))['version'])")
          STEOP_MARKET_VER=$(python3 -c "import json; print([p['version'] for p in json.load(open('.claude-plugin/marketplace.json'))['plugins'] if p['name']=='steop'][0])")
          if [ "$STEOP_PLUGIN_VER" != "$STEOP_MARKET_VER" ]; then
            echo "Version mismatch: steop plugin.json=$STEOP_PLUGIN_VER marketplace.json=$STEOP_MARKET_VER"
            exit 1
          fi
          echo "Steop versions match: $STEOP_PLUGIN_VER"

      - name: Check Go version constant sync
        run: |
          PLUGIN_VER=$(python3 -c "import json; print(json.load(open('plugins/steop/.claude-plugin/plugin.json'))['version'])")
          GO_VER=$(grep -E '^const Version' apps/steop/version.go | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "$PLUGIN_VER" != "$GO_VER" ]; then
            echo "Version mismatch: steop plugin.json=$PLUGIN_VER version.go=$GO_VER"
            exit 1
          fi
          echo "Steop Go version matches: $GO_VER"

  check-go:
    name: Check Go (steop)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/steop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: apps/steop/go.sum
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build -o /tmp/steop .
      - name: Test
        run: go test ./...
