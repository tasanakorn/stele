[package]
name = "stele"
version = "0.1.0"
edition = "2021"
description = "Shared memory layer for Claude Code via MCP"

[dependencies]
rmcp = { version = "1", features = ["server", "macros", "transport-streamable-http-server"] }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
rusqlite = { version = "0.34", features = ["bundled", "column_decltype"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
tokio-util = "0.7"
ulid = "1"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }

[profile.dev]
debug = 0

[profile.release]
debug = 0
strip = true
lto = true
