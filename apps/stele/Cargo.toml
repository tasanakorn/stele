[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.18.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[profile.dev]
debug = 0
incremental = false

[profile.release]
debug = 0
strip = true
lto = "thin"
opt-level = "s"
