[package]
name = "stele-cli"
version.workspace = true
edition.workspace = true
description = "CLI client for Stele shared memory server"

[[bin]]
name = "stele"
path = "src/main.rs"

[dependencies]
stele-common = { path = "../stele-common" }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
toml = "0.8"
dirs = "6"
gethostname = "1"
