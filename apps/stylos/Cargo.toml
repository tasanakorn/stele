[workspace]
members = ["crates/*"]
exclude = ["third_party"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
zenoh = "=1.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
json5 = "0.4"
clap = { version = "4", features = ["derive"] }
thiserror = "=2.0.18"
anyhow = "1"

[profile.dev]
debug = 0
incremental = false

[profile.release]
debug = 0
strip = true
lto = true
codegen-units = 1
opt-level = "s"
